[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hessiantrace"
version = "0.1.0"
description = "Empirical analysis of optimizer behavior on non-convex loss landscapes"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
